[package]
name = "roxy-desktop"
version = "0.1.0"
description = "Desktop shell for Roxy"
authors = ["Roxy contributors"]
edition = "2024"

[lib]
name = "roxy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
roxy = { path = ".." }
tauri = { version = "2.10.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
