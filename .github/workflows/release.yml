name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.1.0)"
        required: true
        type: string

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "localify-test-${{ matrix.os }}"
          cache-on-failure: true

      - name: Run unit tests
        run: cargo test

      - name: Run Clippy
        run: cargo clippy -- -D warnings

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "localify-release-macos"
          cache-on-failure: true

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          # Strip 'v' prefix if present
          VERSION=$(echo "$TAG" | sed 's/^v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build release binary
        run: cargo build --release --bin localify

      - name: Package binary
        run: |
          cd target/release
          # Copy raw binary with versioned name for direct downloads
          cp localify localify-${{ steps.version.outputs.version }}-macos-arm64
          # Create tarball with binary named "localify"
          tar -czf localify-${{ steps.version.outputs.version }}-macos-arm64.tar.gz localify

      - name: Generate SHA256 checksums
        run: |
          cd target/release
          shasum -a 256 localify-${{ steps.version.outputs.version }}-macos-arm64 > localify-${{ steps.version.outputs.version }}-macos-arm64.sha256
          shasum -a 256 localify-${{ steps.version.outputs.version }}-macos-arm64.tar.gz > localify-${{ steps.version.outputs.version }}-macos-arm64.tar.gz.sha256
          cat localify-${{ steps.version.outputs.version }}-macos-arm64.sha256
          cat localify-${{ steps.version.outputs.version }}-macos-arm64.tar.gz.sha256

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            target/release/localify-${{ steps.version.outputs.version }}-macos-arm64
            target/release/localify-${{ steps.version.outputs.version }}-macos-arm64.sha256
            target/release/localify-${{ steps.version.outputs.version }}-macos-arm64.tar.gz
            target/release/localify-${{ steps.version.outputs.version }}-macos-arm64.tar.gz.sha256

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "localify-release-linux"
          cache-on-failure: true

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          # Strip 'v' prefix if present
          VERSION=$(echo "$TAG" | sed 's/^v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build release binary
        run: cargo build --release --bin localify

      - name: Package binary
        run: |
          cd target/release
          # Copy raw binary with versioned name for direct downloads
          cp localify localify-${{ steps.version.outputs.version }}-linux-amd64
          # Create tarball
          tar -czf localify-${{ steps.version.outputs.version }}-linux-amd64.tar.gz localify

      - name: Generate SHA256 checksums
        run: |
          cd target/release
          sha256sum localify-${{ steps.version.outputs.version }}-linux-amd64 > localify-${{ steps.version.outputs.version }}-linux-amd64.sha256
          sha256sum localify-${{ steps.version.outputs.version }}-linux-amd64.tar.gz > localify-${{ steps.version.outputs.version }}-linux-amd64.tar.gz.sha256
          cat localify-${{ steps.version.outputs.version }}-linux-amd64.sha256
          cat localify-${{ steps.version.outputs.version }}-linux-amd64.tar.gz.sha256

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            target/release/localify-${{ steps.version.outputs.version }}-linux-amd64
            target/release/localify-${{ steps.version.outputs.version }}-linux-amd64.sha256
            target/release/localify-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
            target/release/localify-${{ steps.version.outputs.version }}-linux-amd64.tar.gz.sha256

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          # Strip 'v' prefix if present
          VERSION=$(echo "$TAG" | sed 's/^v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # Detect pre-release (version contains a hyphen, e.g. 0.5.0-beta.1)
          if echo "$VERSION" | grep -q '-'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/

      - name: Generate changelog for this release
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip all
        env:
          OUTPUT: release_notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Localify ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            artifacts/localify-${{ steps.version.outputs.version }}-macos-arm64
            artifacts/localify-${{ steps.version.outputs.version }}-macos-arm64.sha256
            artifacts/localify-${{ steps.version.outputs.version }}-macos-arm64.tar.gz
            artifacts/localify-${{ steps.version.outputs.version }}-macos-arm64.tar.gz.sha256
            artifacts/localify-${{ steps.version.outputs.version }}-linux-amd64
            artifacts/localify-${{ steps.version.outputs.version }}-linux-amd64.sha256
            artifacts/localify-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
            artifacts/localify-${{ steps.version.outputs.version }}-linux-amd64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
